<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* layers video and 3D canvas on top of each other */
    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #camera-view {
      position: relative;
    }

    /* Mirror the camera only; keep overlay text readable. */
    video {
      transform: scaleX(-1);
    }
  </style>
</head>
<body>
<main id="camera-view">
  <video id="camera" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
</main>

<script>
  const video = document.querySelector('#camera');
  const view = document.querySelector('#camera-view');
  const canvas = document.querySelector('#overlay');
  const ctx = canvas.getContext('2d');
  let cameraStream;
  const diagram = new Image();
  diagram.src = '../assets/placeholder-diagram.svg';

  // Match the display area to the camera's aspect ratio.
  function sizeView() {
    const ratio = video.videoWidth / video.videoHeight;
    const width = Math.min(window.innerWidth, window.innerHeight * ratio);
    view.style.width = `${width}px`;
    view.style.height = `${width / ratio}px`;
  }

  // Load MediaPipe only after the browser has asked for camera permission.
  function loadHandTracking() {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js';
      script.crossOrigin = 'anonymous';
      script.onload = resolve;
      script.onerror = () => reject(new Error('Handerkennung konnte nicht geladen werden.'));
      document.head.appendChild(script);
    });
  }

  // Start camera access and hand tracking.
  async function start() {
    // Ask for camera permission before loading the tracking library.
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: {facingMode: 'environment'} });
    video.srcObject = cameraStream;
    await video.play();

    await loadHandTracking();

    // - initialize MediaPipe Hands -
    // MediaPipe finds the hand landmarks; Canvas 2D draws the labels.
    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    sizeView();
    window.addEventListener('resize', sizeView);

    // - Draw labels at the index fingertips -
    // Landmark 8 is the index fingertip for both hands.
    hands.onResults(results => {

      // Clear the previous frame.
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const detectedHands = results.multiHandLandmarks;
      if (!detectedHands) return;

      // Configure the label appearance.
      ctx.font = 'bold 24px sans-serif';
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';

      // Draw one label for each detected hand (up to two).
      detectedHands.forEach(hand => {
        const palmCenter = hand[9];

        // Convert normalized coordinates to canvas pixels.
        // Mirror the x coordinate to match the mirrored video.
        const x = (1 - palmCenter.x) * canvas.width;
        const y = palmCenter.y * canvas.height;

        // draw the diagram
        if (diagram.complete && diagram.naturalWidth > 0) {

          // Calculate diagram size relative to the visible palm width.
          const palmWidth = Math.hypot(
                  (hand[17].x - hand[5].x) * canvas.width,
                  (hand[17].y - hand[5].y) * canvas.height,
                  (hand[17].z - hand[5].z) * canvas.width
          );

          const width = palmWidth * 1.5;
          const height = width / 1.6;

          // Draw the diagram centered above the index fingertip.
          ctx.drawImage(diagram, x - width / 2, y - height, width, height);

        }

      });
    });

    // Send each available camera frame to MediaPipe.
    async function trackFrame() {
      if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        await hands.send({ image: video });
      }
      requestAnimationFrame(trackFrame);
    }

    trackFrame();
  }

  start().catch(error => {
    console.error(error);
    cameraStream?.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  });
</script>
</body>
</html>
