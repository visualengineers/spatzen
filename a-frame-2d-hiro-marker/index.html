
<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- A-Frame Core: Web-3D-Framework which works in a virtual world -->
	<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

	<!-- AR.js: library for augmented reality - uses camera and detects markers -->
	<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@latest/aframe/build/aframe-ar.js"></script>
</head>

<body>
<style>
	/* Instruction text at the bottom of the screen */
	#instruction {
		position: fixed;
		bottom: 25px;
		left: 50%;
		transform: translateX(-50%);
		z-index: 1000;

		padding: 12px 20px;
		background: rgba(0, 0, 0, 0.7);
		color: white;
		border-radius: 10px;

		font-family: Arial, sans-serif;
		font-size: 16px;
		text-align: center;
		white-space: nowrap;
		max-width: 90%;
		box-sizing: border-box;
	}
</style>
<a-scene
		embedded
		arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;"
		xr-mode-ui="enabled: false">

	<!-- Hiro marker: Everything inside this tag is positioned relative to the marker -->
	<a-marker preset="hiro">

		<!-- SVG diagram lying flat on the marker -->
		<a-image
				src="../assets/placeholder-diagram.svg"
				position="0 0.01 0"
				rotation="-90 0 0"
				width="1"
				height="0.625"
				material="side: double">
		</a-image>

	</a-marker>

	<a-entity camera></a-entity>
</a-scene>

<!-- Instruction overlay -->
<div id="instruction">
	Richte die Kamera auf einen Hiro Marker
</div>
</body>
</html>
