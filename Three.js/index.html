<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

      /* layers video and 3D canvas on top of each other */
      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #camera-view {
        position: relative;
      }

      /* Mirror the camera only; keep overlay text readable. */
      video {
        transform: scaleX(-1);
      }
    </style>
  </head>
  <body>
    <main id="camera-view">
      <video id="camera" autoplay playsinline></video>
      <canvas id="overlay"></canvas>
    </main>

    <script>
      const video = document.querySelector('#camera');
      const view = document.querySelector('#camera-view');
      const canvas = document.querySelector('#overlay');
      let cameraStream;

      // Match the display area to the camera's aspect ratio.
      function sizeView() {
        const ratio = video.videoWidth / video.videoHeight;
        const width = Math.min(window.innerWidth, window.innerHeight * ratio);
        view.style.width = `${width}px`;
        view.style.height = `${width / ratio}px`;
      }

      // Load MediaPipe only after the browser has asked for camera permission.
      function loadHandTracking() {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js';
          script.crossOrigin = 'anonymous';
          script.onload = resolve;
          script.onerror = () => reject(new Error('Handerkennung konnte nicht geladen werden. Prüfe deine Internetverbindung.'));
          document.head.appendChild(script);
        });
      }

      // Start camera access and hand tracking.
      async function start() {
        // Ask for camera permission before loading optional 3D and tracking libraries.
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true }); // asks for camera permission
        video.srcObject = cameraStream;   // binds camera stream to video element
        await video.play();   // waits for the camera to start

        // load Three.js and MediaPipe Hands in parallel; throws if either fails.
        const [THREE] = await Promise.all([
          import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'),
          loadHandTracking()
        ]);

        // - initialize MediaPipe Hands -
        // MediaPipe finds the hand landmarks; Three.js uses them to pose the paper.
        const hands = new Hands({
          locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
        });
        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1
        });

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        sizeView();
        window.addEventListener('resize', sizeView);


        // - initialize Three.js scene, camera and renderer - 
        // Render into the transparent canvas above the mirrored camera video.
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });   // alpha true for transparent backgrund and visibility of camera, antialias true for smoother edges
        renderer.setPixelRatio(1);
        renderer.setSize(canvas.width, canvas.height, false);
        const scene = new THREE.Scene();

        // Pixel-sized camera coordinates keep the overlay aligned with the video.
        const camera = new THREE.OrthographicCamera(
          -canvas.width / 2, canvas.width / 2,
          canvas.height / 2, -canvas.height / 2,
          0.1, 2000
        );
        camera.position.z = 1000;
        renderer.setClearColor(0x000000, 0);

        // Draw the paper and text once; the 3D plane moves with the hand.
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 512;
        labelCanvas.height = 160;
        const labelContext = labelCanvas.getContext('2d');
        labelContext.fillStyle = '#fffdf2';
        labelContext.beginPath();
        labelContext.roundRect(0, 0, labelCanvas.width, labelCanvas.height, 24);
        labelContext.fill();
        labelContext.strokeStyle = '#c7c4b8';
        labelContext.lineWidth = 4;
        labelContext.stroke();
        labelContext.fillStyle = '#222';
        labelContext.font = 'bold 64px sans-serif';
        labelContext.textAlign = 'center';
        labelContext.textBaseline = 'middle';
        labelContext.fillText('Hello World', labelCanvas.width / 2, labelCanvas.height / 2);
        
        // Create a Three.js texture from the canvas and apply it to a plane.
        const labelTexture = new THREE.CanvasTexture(labelCanvas);
        labelTexture.colorSpace = THREE.SRGBColorSpace;

        // create sign as a plane mesh with the label texture, initially invisible
        const sign = new THREE.Mesh(
          new THREE.PlaneGeometry(1, 1),
          new THREE.MeshBasicMaterial({ map: labelTexture, transparent: true, side: THREE.DoubleSide })
        );
        sign.visible = false;
        scene.add(sign);

        // Convert normalized image points and relative depth to video-sized coordinates.
        // This is important because MediaPipe returns points in a normalized coordinate system 
        // (0 to 1) and relative depth, while Three.js uses pixel coordinates for rendering and a 
        // center point at the center of the screen.
        function toScenePoint(point) {
          return new THREE.Vector3(
            (0.5 - point.x) * canvas.width,
            (0.5 - point.y) * canvas.height,
            -point.z * canvas.width
          );
        }

        hands.onResults(results => {
          const hand = results.multiHandLandmarks?.[0];
          if (!hand) {
            sign.visible = false;
            renderer.render(scene, camera);
            return;
          }

          // - calculate position and rotation of sign - 
          // Landmarks 5, 9 and 17 are finger bases; 0 is the wrist.
          const indexBase = toScenePoint(hand[5]);
          const middleBase = toScenePoint(hand[9]);
          const pinkyBase = toScenePoint(hand[17]);
          const wrist = toScenePoint(hand[0]);

          // calculate three orthogonal axes for the sign plane based on the hand landmarks
          const palmWidth = indexBase.distanceTo(pinkyBase);
          const xAxis = pinkyBase.clone().sub(indexBase).normalize();
          const yAxis = middleBase.clone().sub(wrist);
          yAxis.addScaledVector(xAxis, -yAxis.dot(xAxis)).normalize();
          const normal = new THREE.Vector3().crossVectors(xAxis, yAxis).normalize();
          // Keep the printed side facing the camera as the hand turns.
          if (normal.z < 0) {
            xAxis.negate();
            normal.negate();
          }
          const orientation = new THREE.Matrix4().makeBasis(xAxis, yAxis, normal);
          const center = [0, 5, 9, 17].reduce(
            (sum, point) => sum.add(toScenePoint(hand[point])),
            new THREE.Vector3()
          ).multiplyScalar(0.25);

          // position, rotate and scale the sign plane based on the calculated axes and center point
          sign.position.copy(center).addScaledVector(normal, 2);
          sign.quaternion.setFromRotationMatrix(orientation);
          sign.scale.set(palmWidth * 2.2, palmWidth * 0.64, 1);
          sign.visible = true;
          renderer.render(scene, camera);
        });

        // Send each available camera frame to MediaPipe.
        async function trackFrame() {
          if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
            await hands.send({ image: video });
          }
          requestAnimationFrame(trackFrame);
        }
        trackFrame();
      }

      start().catch(error => {
        console.error('Kamera oder Handerkennung konnte nicht gestartet werden:', error);
        cameraStream?.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      });
    </script>
  </body>
</html>
