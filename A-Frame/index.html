<!DOCTYPE html>
<html>
  <head>

  <!-- A-Frame Core: Web-3D-Framework which works ina virtual world -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- AR.js: library for augmented reality - uses camera and detects markers-->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@latest/aframe/build/aframe-ar.js"></script>
</head>
  <body>
	  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

		  <!-- Hiro marker which represents bottom or table. Everything inside this tag is positioned relative to the marker -->
		  <a-marker preset="hiro">

        <!-- Plane which represents information card and is placed relative to the marker -->
		    <a-plane
		      position="0 0 0"
		      rotation="0 0 0"
		      width="1"
		      height="1.5"
		      color="#fff"
		      shadow
          opacity="1"
		    >
          <!-- Text which displays information on the card -->
          <a-text
            value="Hello World"
            position="0 0 0"
            rotation="0 0 0"
            align="center"
            color="#000"
            width="1.6"
            height="0.4"
            z-index="1"
          ></a-text>
        </a-plane>
		  </a-marker>
		</a-scene>
	</body>
</html>
